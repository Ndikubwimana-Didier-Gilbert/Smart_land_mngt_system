<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="icon" href="icons/check.png">
    <title>Admin Login</title>

    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 4.7rem);
        }

        .login-box {
            background-color: white;
            padding: 40px 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: #1e1f2d;
            font-size: 1.4rem;
        }

        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 0.85rem;
            color: #444;
        }

        .login-box input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .login-box input:focus {
            border-color: #6b8e23;
        }

        .login-box button {
            width: 100%;
            padding: 11px;
            background-color: #1e1f2d;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-box button:hover {
            background-color: #6b8e23;
        }
    </style>
</head>

<body>
    <header class="nav">
        <ul class="nav-links">
            <li><a href="index.html"><img src="icons/back.png" alt="">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Return Home</a></li>
        </ul>
    </header>

    <div class="login-container">
        <div class="login-box">
            <h2>Admin Login</h2>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password">

            <button type="submit">Login</button>
        </div>
    </div>

</body>
</html>
