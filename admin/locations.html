<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Locations - LandTrack</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/tables.css">
</head>
<body>

<header class="admin-header">
  <a href="dashboard.html" class="navbar__brand">
    <span class="navbar__mark" aria-hidden="true"></span>
    LandTrack Admin
  </a>
  <p id="welcomeMessage"></p>
  <a href="login.html" class="logout-link">Log out</a>
</header>

<nav class="admin-nav">
  <a href="dashboard.html" class="admin-nav__link">Dashboard</a>
  <a href="owners.html" class="admin-nav__link">Owners</a>
  <a href="locations.html" class="admin-nav__link active">Locations</a>
  <a href="parcels.html" class="admin-nav__link">Parcels</a>
  <a href="applications.html" class="admin-nav__link">Applications</a>
  <a href="admins.html" class="admin-nav__link">Admins</a>
</nav>

<main class="admin-main">
  <h1>Manage Locations</h1>
  <p>Add new locations here so they can be selected when registering a parcel.</p>

  <div class="form-section">
    <h2>Add Location</h2>
    <form id="addLocationForm">
      <div class="form-row">
        <div class="form-group">
          <label for="newDistrict">District</label>
          <input type="text" id="newDistrict" required>
        </div>
        <div class="form-group">
          <label for="newCell">Cell</label>
          <input type="text" id="newCell" required>
        </div>
        <div class="form-group">
          <label for="newPlotNumber">Plot Number</label>
          <input type="text" id="newPlotNumber" required>
        </div>
      </div>
      <button type="submit" class="submit-btn">Add Location</button>
    </form>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Location ID</th>
          <th>District</th>
          <th>Cell</th>
          <th>Plot Number</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="locationsTableBody"></tbody>
    </table>
  </div>
</main>

<script src="../js/db.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/locations.js"></script>
</body>
</html>
