<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - LandTrack</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/forms.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p>Log in to manage owners, parcels, locations, and applications. <span style="color:blue">use username=>admin,password=>admin123 for testing</span></p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="submit-btn">Log In</button>
    </form>

    <p class="error-message" id="loginError"></p>

    <p class="back-link"><a href="../index.html">&larr; Back to home</a></p>
  </div>
</div>

<script src="../js/db.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
