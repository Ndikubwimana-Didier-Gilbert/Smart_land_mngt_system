<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Owners - LandTrack</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/tables.css">
</head>
<body>

<header class="admin-header">
  <a href="dashboard.html" class="navbar__brand">
    <span class="navbar__mark" aria-hidden="true"></span>
    LandTrack Admin
  </a>
  <p id="welcomeMessage"></p>
  <a href="login.html" class="logout-link">Log out</a>
</header>

<nav class="admin-nav">
  <a href="dashboard.html" class="admin-nav__link">Dashboard</a>
  <a href="owners.html" class="admin-nav__link active">Owners</a>
  <a href="locations.html" class="admin-nav__link">Locations</a>
  <a href="parcels.html" class="admin-nav__link">Parcels</a>
  <a href="applications.html" class="admin-nav__link">Applications</a>
  <a href="admins.html" class="admin-nav__link">Admins</a>
</nav>

<main class="admin-main">
  <h1>Manage Owners</h1>
  <p>Add new owners here so they can be selected when registering a parcel.</p>

  <div class="form-section">
    <h2>Add Owner</h2>
    <form id="addOwnerForm">
      <div class="form-row">
        <div class="form-group">
          <label for="newFirstName">First Name</label>
          <input type="text" id="newFirstName" required>
        </div>
        <div class="form-group">
          <label for="newLastName">Last Name</label>
          <input type="text" id="newLastName" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="newEmail">Email</label>
          <input type="email" id="newEmail" required>
        </div>
        <div class="form-group">
          <label for="newPhone">Phone</label>
          <input type="tel" id="newPhone" required>
        </div>
      </div>
      <div class="form-group">
        <label for="newNationalId">National ID or Passport</label>
        <input type="text" id="newNationalId" required>
      </div>
      <button type="submit" class="submit-btn">Add Owner</button>
    </form>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Owner ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>National ID</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="ownersTableBody"></tbody>
    </table>
  </div>
</main>

<script src="../js/db.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/owners.js"></script>
</body>
</html>
